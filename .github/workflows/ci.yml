name: Safe public core CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  portable-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python sources compile
        shell: pwsh
        run: python -m compileall -q runtime
      - name: Pairing permission and consent regression
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Real isolated Bridge RPC and read-only task acceptance
        shell: pwsh
        run: python tests/integration/isolated_rpc_smoke.py
      - name: Detached session PID identity with real Windows FILETIME
        shell: pwsh
        run: python tests/integration/detached_identity_probe.py
      - name: Completed terminal Job cleanup and foreign process preservation
        shell: pwsh
        run: python tests/integration/owned_job_cleanup_smoke.py
      - name: Real two-agent Job isolation and independent scoped cleanup
        shell: pwsh
        run: python tests/integration/two_agent_isolated_rpc_smoke.py
      - name: Actual isolated Bridge restart and detached output recovery
        shell: pwsh
        run: python tests/integration/detached_restart_smoke.py
      - name: Real lost-ACK hard-crash durable request replay regression
        shell: pwsh
        run: python tests/integration/durable_crash_smoke.py
      - name: Hidden Excel COM and independent OOXML smoke (explicit skip if Excel absent)
        shell: pwsh
        run: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests/integration/excel_com_smoke.ps1
      - name: PowerShell parsing
        shell: pwsh
        run: |
          $errorCount = 0
          Get-ChildItem -Recurse -File -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errs) | Out-Null
            $errorCount += @($errs).Count
          }
          if ($errorCount -gt 0) { throw "PowerShell parse failed: $errorCount" }
      - name: No bundled visual or browser assets
        shell: pwsh
        run: |
          if (Test-Path 'assets') { throw 'Unexpected vendor binary assets committed to public source' }
          if (-not (Test-Path 'runtime/bridge-v3/ff_win_v3_main.py')) { throw 'Missing core runtime' }
