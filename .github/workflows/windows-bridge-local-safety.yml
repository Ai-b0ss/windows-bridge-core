name: Windows Bridge local safety regressions

on:
  pull_request:
    paths:
      - 'runtime/bridge-v3/cua_bridge_v3.py'
      - 'runtime/bridge-v3/ff_win_v3_keeper.ps1'
      - 'runtime/bridge-v3/cua_owner_activity.py'
      - 'runtime/bridge-v3/cua_browser_playwright.mjs'
      - 'runtime/bridge-v3/test_cua_owner_activity_guard.py'
      - 'runtime/bridge-v3/test_cua_browser_iframe_verify.mjs'
      - '.github/workflows/windows-bridge-local-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-safety:
    name: Isolated browser and owner guard
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: |
          python -c "import ast,pathlib; root=pathlib.Path('runtime/bridge-v3'); [ast.parse((root/name).read_text('utf-8')) for name in ('cua_bridge_v3.py', 'cua_owner_activity.py')]"
      - name: Check JavaScript syntax and iframe navigation rules
        run: |
          node --check runtime/bridge-v3/cua_browser_playwright.mjs
          node runtime/bridge-v3/test_cua_browser_iframe_verify.mjs
      - name: Test owner activity guard with fake clock
        run: python -m unittest discover -s runtime/bridge-v3 -p 'test_cua_owner_activity_guard.py' -v
